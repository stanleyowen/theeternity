# Eternity Esports — Apache hardening
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes -MultiViews +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php
</Directory>

# Application internals are never served over HTTP.
<DirectoryMatch "^/var/www/html/(app|bin|database|docker|storage)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "^\.|\.(sql|sqlite|md|sh|ini|lock|dist|example|yml|yaml|log)$|^(Dockerfile|LICENSE)$">
    Require all denied
</FilesMatch>
RedirectMatch 404 /\.git

ErrorDocument 403 /global-error/403.php
ErrorDocument 404 /global-error/404.php
ErrorDocument 405 /global-error/405.php
ErrorDocument 408 /global-error/408.php
ErrorDocument 500 /global-error/500.php
ErrorDocument 502 /global-error/502.php
ErrorDocument 503 /global-error/503.php
ErrorDocument 504 /global-error/504.php

# Baseline headers for static files (PHP pages send a full CSP themselves).
Header set X-Content-Type-Options "nosniff"
Header set X-Frame-Options "DENY"
Header set Referrer-Policy "strict-origin-when-cross-origin"
Header always unset X-Powered-By

<LocationMatch "^/assets/">
    Header set Cache-Control "public, max-age=604800"
</LocationMatch>
