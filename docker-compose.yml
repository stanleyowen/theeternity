# Archive (read-only) showcase:   docker compose up --build   ->  http://localhost:8080
services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      APP_ENV: production
      ARCHIVE_MODE: "true"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/apache2
      - /var/lock/apache2
